name: amd-gpu-sampler

on:
  push:
    paths:
      - "amd-gpu-sampler/**"
      - ".github/workflows/amd-gpu-sampler.yml"
  pull_request:
    paths:
      - "amd-gpu-sampler/**"
      - ".github/workflows/amd-gpu-sampler.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Unit tests (no GPU)
        working-directory: amd-gpu-sampler
        run: python -m pytest
