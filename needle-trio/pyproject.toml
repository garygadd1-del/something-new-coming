[project]
name = "needle-trio"
version = "0.1.0"
description = "Dry-run coder-trio needle router (Kleene gate, local KoboldCpp sketch)."
readme = "README.md"
requires-python = ">=3.11" }

[project.scripts]
needle-trio = "needle_trio.__main__:main"
needle-trio-proxy = "needle_trio.proxy:main"

[tool.setuptools.packages.find]
include = ["needle_trio*"]

[tool.unittest]
# Run from this directory: python -m unittest discover -s tests -v
